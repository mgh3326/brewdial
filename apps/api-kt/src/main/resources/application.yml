server:
  port: ${PORT:3021}

spring:
  application:
    name: brewdial-api
  # DATABASE_URL (postgres:// or mysql://) selects the vendor; see
  # DatabaseUrlEnvironmentPostProcessor for the driver and Flyway folder.
  flyway:
    # Migration SQL is literal: no ${...} substitution.
    placeholder-replacement: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health
