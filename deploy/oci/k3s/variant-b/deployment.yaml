# BrewDial API — VARIANT (B): pod network (zero-downtime rolling updates).
#
# Apply INSTEAD OF ../deployment.yaml (delete the variant-A Deployment first).
# Trade-off vs (A) — see RUNBOOK.md §B for the full decision record:
#   + maxSurge=1 works → rolling updates with NO downtime.
#   - REQUIRES production changes first (operator + separate approval):
#       1. host Postgres must also listen on the k3s CNI bridge address
#          (listen_addresses += bridge IP; pg_hba limited to the pod CIDR), and
#       2. cloudflared must be re-pointed to http://127.0.0.1:30020 (the
#          NodePort in service.yaml) instead of http://127.0.0.1:3020.
#   - Secret DATABASE_URL must use the bridge IP, not 127.0.0.1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brewdial-api
  namespace: brewdial
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # new pod comes up healthy BEFORE the old one stops
      maxUnavailable: 0
  selector:
    matchLabels:
      app: brewdial-api
  template:
    metadata:
      labels:
        app: brewdial-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # `node` user in the base image
        runAsGroup: 1000
      initContainers:
        # Same migration gate as variant A: runs before app start, failure
        # blocks the app container (Init:CrashLoopBackOff).
        - name: migrate
          image: ghcr.io/mgh3326/brewdial:latest # deploy with a digest — see RUNBOOK.md
          command:
            - node
            - /migrate/node_modules/node-pg-migrate/bin/node-pg-migrate.js
            - -m
            - /migrate/migrations
            - -j
            - sql
            - up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: brewdial-api-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/mgh3326/brewdial:latest # deploy with a digest — see RUNBOOK.md
          envFrom:
            - configMapRef:
                name: brewdial-api-config
            - secretRef:
                name: brewdial-api-secret
          env:
            # Pod network: NodePort traffic is DNATed to the pod IP, so the
            # server must listen on all pod interfaces (NOT 127.0.0.1).
            - name: HOST
              value: "0.0.0.0"
          ports:
            - containerPort: 3020
          readinessProbe:
            httpGet:
              path: /api/db/health
              port: 3020
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3020
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
