# TEMPLATE — copy to secret.yaml (gitignored) and fill in, or create with
# kubectl create secret. Real values live ONLY on the OCI box / in the
# operator's vault, never committed.
#
# DATABASE_URL differs per network variant (see RUNBOOK.md §A/§B):
#   (A) hostNetwork:   postgres://brewdial_app:<pw>@127.0.0.1:5432/brewdial
#   (B) pod network:   postgres://brewdial_app:<pw>@<CNI-BRIDGE-IP>:5432/brewdial
#                      (bridge IP is known only after k3s is installed)
apiVersion: v1
kind: Secret
metadata:
  name: brewdial-api-secret
  namespace: brewdial
type: Opaque
stringData:
  DATABASE_URL: "postgres://brewdial_app:CHANGE_ME@127.0.0.1:5432/brewdial"
  AGENT_TOKEN: "CHANGE_ME" # openssl rand -hex 32
