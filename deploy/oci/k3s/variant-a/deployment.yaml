# BrewDial API — VARIANT (A): hostNetwork (legacy shape; NOT production default).
#
# Preserved for:
#   - RUNBOOK §6 recovery bypass (podman --network host uses the same premises)
#   - CI R7 A↔B switch validation
#   - optional rollback path if operator ever reverts cloudflared to :3020
#
# Production default is variant B (../deployment.yaml + ../service.yaml),
# cutover completed 2026-08-06. Do NOT apply this file on the production box
# while systemd still holds :3020 and cloudflared points at NodePort 30020 —
# hostNetwork would fight for :3020 with the systemd fallback unit.
#
# With hostNetwork the pod shares the node network namespace:
#   DATABASE_URL → postgres://...@127.0.0.1:5432/...
#   cloudflared → http://127.0.0.1:3020
# COST: two pods can never bind 3020 at once → maxSurge MUST be 0 → every
# rollout has a downtime window (old pod stops before new pod starts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brewdial-api
  namespace: brewdial
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0 # hostNetwork: second pod cannot bind :3020 while first holds it
      maxUnavailable: 1
  selector:
    matchLabels:
      app: brewdial-api
  template:
    metadata:
      labels:
        app: brewdial-api
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet # keep cluster DNS working on hostNetwork
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # `node` user in the base image
        runAsGroup: 1000
      initContainers:
        # Schema migrations run BEFORE the app container starts, on every pod
        # (re)start. node-pg-migrate tracks applied migrations in pgmigrations,
        # so re-runs are no-ops. If migrations fail, this container exits
        # non-zero and the app container NEVER starts (Init:CrashLoopBackOff).
        - name: migrate
          image: ghcr.io/mgh3326/brewdial@sha256:REPLACE_WITH_RELEASE_DIGEST # replace before apply — see RUNBOOK.md
          command:
            - node
            - /migrate/node_modules/node-pg-migrate/bin/node-pg-migrate.js
            - -m
            - /migrate/migrations
            - -j
            - sql
            - up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: brewdial-api-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/mgh3326/brewdial@sha256:REPLACE_WITH_RELEASE_DIGEST # replace before apply — see RUNBOOK.md
          envFrom:
            - configMapRef:
                name: brewdial-api-config
            - secretRef:
                name: brewdial-api-secret
          env:
            # hostNetwork: 127.0.0.1 binding = cloudflared-only reachability,
            # same as the systemd fallback service on :3020.
            - name: HOST
              value: "127.0.0.1"
          ports:
            - containerPort: 3020
          readinessProbe: # ready only when the DB chain works end-to-end
            # exec probe: with hostNetwork + HOST=127.0.0.1 the kubelet CANNOT
            # httpGet the pod (it dials the node IP, the app binds loopback
            # only). exec runs inside the pod's netns where 127.0.0.1 works.
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:3020/api/db/health"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["wget", "-qO-", "http://127.0.0.1:3020/api/health"]
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
