# CI-VALIDATION ONLY — test secret pointing at the in-cluster throwaway
# Postgres (ci/postgres.yaml). Cluster-DNS name resolves from BOTH variants:
# default B uses cluster DNS natively; variant A (variant-a/) uses
# dnsPolicy ClusterFirstWithHostNet. NEVER use on the production box (real
# secret comes from secret.example.yaml filled by the operator).
apiVersion: v1
kind: Secret
metadata:
  name: brewdial-api-secret
  namespace: brewdial
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:postgrespassword@postgres.brewdial.svc.cluster.local:5432/brewdial"
  AGENT_TOKEN: "ci-test-agent-token-not-a-real-secret"
