apiVersion: v1
kind: ConfigMap
metadata:
  name: brewdial-api-config
  namespace: brewdial
data:
  PORT: "3020"
  NODE_ENV: "production"
  # Sentry release tag. Set at deploy time:
  #   kubectl -n brewdial patch configmap brewdial-api-config --type merge \
  #     -p '{"data":{"GIT_SHA":"<sha>"}}'
  GIT_SHA: ""
  # Leave empty in the repo template. Production injects a real DSN into the
  # live pod (confirmed 2026-08-06 cutover — Sentry re-enabled). Do not commit
  # a DSN here. instrument.ts inits only when this value is non-empty.
  SENTRY_DSN: ""
