name: Deploy BrewDial Production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to the workflow commit)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: brewdial-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to MacBook launchd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure SSH key and known host
        shell: bash
        env:
          MACBOOK_DEPLOY_SSH_HOST: ${{ secrets.MACBOOK_DEPLOY_SSH_HOST }}
          MACBOOK_DEPLOY_SSH_HOST_KEY: ${{ secrets.MACBOOK_DEPLOY_SSH_HOST_KEY }}
          MACBOOK_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.MACBOOK_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MACBOOK_DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/brewdial_deploy_key
          chmod 600 ~/.ssh/brewdial_deploy_key
          deploy_host="${MACBOOK_DEPLOY_SSH_HOST#*@}"
          printf '%s %s\n' "$deploy_host" "$MACBOOK_DEPLOY_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SSH
        shell: bash
        env:
          MACBOOK_DEPLOY_SSH_HOST: ${{ secrets.MACBOOK_DEPLOY_SSH_HOST }}
          DEPLOY_SHA: ${{ github.event.inputs.sha || github.sha }}
          DEPLOY_BRANCH: production
        run: |
          set -euo pipefail
          ssh_opts=(
            -i ~/.ssh/brewdial_deploy_key
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o ConnectTimeout=30
          )

          deploy_sha_q=$(printf '%q' "$DEPLOY_SHA")
          deploy_branch_q=$(printf '%q' "$DEPLOY_BRANCH")
          ssh "${ssh_opts[@]}" "$MACBOOK_DEPLOY_SSH_HOST" \
            "cd /Users/mgh3326/work/brewdial && scripts/deploy-production.sh $deploy_sha_q $deploy_branch_q"
