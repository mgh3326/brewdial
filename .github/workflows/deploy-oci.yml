name: Deploy OCI (shiftgate)

# ROB-1435 — production deploy through shiftgate (https://github.com/mgh3326/shiftgate).
#
# build:   docker build (arm64, the OCI box is aarch64) → push to GHCR → read the
#          pushed digest.
# release: on a production release, move the `production` tag to that digest
#          (separate job behind the `oci-production` environment).
# plan:    print the digest and the host command the follower will run.
#
# Deploys are pull-based (operator 2026-11-01): CI never reaches the host and
# needs no host credentials. On the OCI host, Dagu runs
# `shiftgate follow brewdial-api-mysql --tag production` every few minutes; it
# resolves the tag through the registry API and runs a normal blue-green deploy
# when the digest changed. A digest that was rolled back on the host is held
# until a newer one is tagged.
#
# Modes:
#   pull_request                      → dry run (build + push + plan; tag untouched)
#   workflow_dispatch dry_run=true    → dry run
#   workflow_dispatch dry_run=false   → release (only when run on the production tip)
#   push to `production`              → release
# A release fails unless the commit is on main's history, whatever the ref.
#
# Rollback is a host command, not a rebuild: `shiftgate rollback brewdial-api-mysql`
# (see docs/runbooks/oci-heatwave-cutover.md).

on:
  push:
    branches: [production]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "apps/api/**"
      - "apps/mcp/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "deploy/oci/shiftgate/**"
      - ".github/workflows/deploy-oci.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and push, print the shiftgate command, touch no host.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # PR dry runs get their own group so they never queue behind a release.
  group: ${{ github.event_name == 'pull_request' && format('deploy-oci-dry-run-{0}', github.ref) || 'deploy-oci-production' }}
  cancel-in-progress: false

env:
  # Must equal `image` of brewdial-api-mysql in deploy/oci/shiftgate/services.yaml.
  IMAGE: ghcr.io/mgh3326/brewdial
  SERVICE: brewdial-api-mysql

jobs:
  build:
    name: Build & push image (arm64)
    # Fork PRs get a read-only token and cannot push, so they have no digest.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      short_sha: ${{ steps.push.outputs.short_sha }}
      mode: ${{ steps.mode.outputs.mode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history for the main-ancestor guard.
          fetch-depth: 0

      - name: Decide mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          mode=deploy
          reason="${EVENT_NAME}"
          if [ "${EVENT_NAME}" = pull_request ]; then
            mode=dry-run; reason="pull requests never deploy"
          elif [ "${EVENT_NAME}" = workflow_dispatch ] && [ "${DRY_RUN_INPUT}" != false ]; then
            mode=dry-run; reason="workflow_dispatch dry_run=${DRY_RUN_INPUT}"
          fi
          if [ "${mode}" = deploy ]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "ERROR: $(git rev-parse HEAD) is not on main's history; refusing to deploy it."
              exit 1
            fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "Mode: ${mode} (${reason})"

      - name: Build image
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short=7 HEAD)"
          echo "SHORT_SHA=${SHORT}" >> "$GITHUB_ENV"
          # GIT_SHA is baked in (Sentry release); shiftgate env is static per service.
          docker build --build-arg "GIT_SHA=${SHORT}" --tag "${IMAGE}:deploy-sha-${SHORT}" .

      - name: Push to GHCR and read the digest
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:deploy-sha-${SHORT_SHA}"
          ref="$(docker image inspect "${IMAGE}:deploy-sha-${SHORT_SHA}" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -m1 "^${IMAGE}@")"
          digest="${ref#"${IMAGE}@"}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "push produced no digest (${ref:-none})"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${digest}"

  plan:
    name: Plan (print the shiftgate command)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print the host command
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          MODE: ${{ needs.build.outputs.mode }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: ${DIGEST}"; exit 1; }
          cmd="shiftgate deploy ${SERVICE} --digest ${DIGEST}"
          echo "SHIFTGATE_COMMAND: ${cmd}"
          if [ "${MODE}" = dry-run ]; then
            echo "DRY RUN: production tag untouched; the host follower sees nothing new."
          else
            echo "RELEASE: production tag moved; the host follower deploys it within minutes."
          fi
          {
            echo "## Deploy OCI (shiftgate) — ${MODE}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}@${DIGEST}\` |"
            echo "| GIT_SHA | \`${SHORT_SHA}\` |"
            echo "| host command | \`${cmd}\` |"
            echo "| mode | \`${MODE}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Release (move the production tag)
    needs: [build, plan]
    if: needs.build.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    # Keeps the environment gate (required reviewers, branch rules) on the step
    # that now triggers the host deploy.
    environment: oci-production
    # One release at a time; a queued older run is replaced by the newer one.
    concurrency:
      group: oci-release-production-tag
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Refuse a stale release
        id: fresh
        run: |
          set -euo pipefail
          git fetch --no-tags origin production
          tip="$(git rev-parse origin/production)"
          if [ "$(git rev-parse HEAD)" != "${tip}" ]; then
            echo "HEAD $(git rev-parse --short HEAD) is not the production tip $(git rev-parse --short "${tip}"); a newer release owns the tag. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point production at the pushed digest (exact manifest bytes)
        if: steps.fresh.outputs.skip == 'false'
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest"; exit 1; }
          repo="${IMAGE#ghcr.io/}"
          tok="$(curl -fsS -u "${GITHUB_ACTOR}:${GH_TOKEN}" "https://ghcr.io/token?scope=repository:${repo}:pull,push" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'
          # Fetch the pushed object by digest (manifest or index) and PUT the same
          # bytes under the tag, so the tag's digest is exactly the built one.
          curl -fsS -H "Authorization: Bearer ${tok}" -H "Accept: ${accept}" -D headers.txt -o manifest.bin "https://ghcr.io/v2/${repo}/manifests/${DIGEST}"
          ctype="$(awk -F': ' 'tolower($1)=="content-type"{print $2}' headers.txt | tr -d '\r' | tail -1)"
          [ "sha256:$(sha256sum manifest.bin | cut -d' ' -f1)" = "${DIGEST}" ] || { echo "fetched bytes do not match ${DIGEST}"; exit 1; }
          curl -fsS -X PUT -H "Authorization: Bearer ${tok}" -H "Content-Type: ${ctype}" --data-binary @manifest.bin "https://ghcr.io/v2/${repo}/manifests/production"
          got="$(curl -fsS -I -H "Authorization: Bearer ${tok}" -H "Accept: ${accept}" "https://ghcr.io/v2/${repo}/manifests/production" | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}' | tr -d '\r')"
          [ "${got}" = "${DIGEST}" ] || { echo "production tag points at ${got}, expected ${DIGEST}"; exit 1; }
          echo "production → ${DIGEST}"
