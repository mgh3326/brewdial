name: Deploy OCI (shiftgate)

# ROB-1435 — production deploy through shiftgate (https://github.com/mgh3326/shiftgate).
#
# build:  docker build (arm64, the OCI box is aarch64) → push to GHCR → read the
#         pushed digest.
# plan:   print the exact host command `shiftgate deploy brewdial-api --digest <digest>`.
# deploy: join the tailnet and run that command over SSH. The deploy key is
#         restricted on the host by shiftgate's forced-command wrapper
#         (examples/ssh-forced-command.sh), which accepts only that command shape.
#
# Modes:
#   pull_request                      → dry run (build + push + plan; no host)
#   workflow_dispatch dry_run=true    → dry run
#   workflow_dispatch dry_run=false   → deploy
#   push to `production`              → deploy
# Every deploy also needs the repository variable SHIFTGATE_DEPLOY_ENABLED=true,
# set by the desk once the host runs shiftgate (runbook phase 1). Until then
# every run is a dry run, so merging this file cannot touch the host.
#
# Host, user and keys come from repository variables/secrets; nothing about the
# host lives in this file:
#   vars.OCI_TAILNET_HOST, vars.OCI_DEPLOY_USER (default: deploy)
#   secrets.TS_OAUTH_CLIENT_ID, secrets.TS_OAUTH_SECRET (Tailscale OAuth client, tag:ci)
#   secrets.SHIFTGATE_DEPLOY_SSH_KEY, secrets.SHIFTGATE_KNOWN_HOSTS
#
# Rollback is a host command, not a rebuild: `shiftgate rollback brewdial-api`
# (see docs/runbooks/oci-heatwave-cutover.md).

on:
  push:
    branches: [production]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "apps/api/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "deploy/oci/shiftgate/**"
      - ".github/workflows/deploy-oci.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and push, print the shiftgate command, touch no host.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Shared with deploy-oci-k3s.yml: one production deploy at a time. PR dry runs
  # get their own group so they never queue behind a release.
  group: ${{ github.event_name == 'pull_request' && format('deploy-oci-dry-run-{0}', github.ref) || 'deploy-oci-production' }}
  cancel-in-progress: false

env:
  # Must equal `image` of brewdial-api in deploy/oci/shiftgate/services.yaml.
  IMAGE: ghcr.io/mgh3326/brewdial
  SERVICE: brewdial-api

jobs:
  build:
    name: Build & push image (arm64)
    # Fork PRs get a read-only token and cannot push, so they have no digest.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      short_sha: ${{ steps.push.outputs.short_sha }}
      mode: ${{ steps.mode.outputs.mode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Decide mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          DEPLOY_ENABLED: ${{ vars.SHIFTGATE_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          mode=deploy
          reason="${EVENT_NAME}"
          if [ "${EVENT_NAME}" = pull_request ]; then
            mode=dry-run; reason="pull requests never deploy"
          elif [ "${EVENT_NAME}" = workflow_dispatch ] && [ "${DRY_RUN_INPUT}" != false ]; then
            mode=dry-run; reason="workflow_dispatch dry_run=${DRY_RUN_INPUT}"
          elif [ "${DEPLOY_ENABLED}" != true ]; then
            mode=dry-run; reason="vars.SHIFTGATE_DEPLOY_ENABLED is not 'true' (host not cut over yet)"
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "Mode: ${mode} (${reason})"

      - name: Build image
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short=7 HEAD)"
          echo "SHORT_SHA=${SHORT}" >> "$GITHUB_ENV"
          # GIT_SHA is baked in (Sentry release); shiftgate env is static per service.
          docker build --build-arg "GIT_SHA=${SHORT}" --tag "${IMAGE}:deploy-sha-${SHORT}" .

      - name: Push to GHCR and read the digest
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:deploy-sha-${SHORT_SHA}"
          ref="$(docker image inspect "${IMAGE}:deploy-sha-${SHORT_SHA}" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -m1 "^${IMAGE}@")"
          digest="${ref#"${IMAGE}@"}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "push produced no digest (${ref:-none})"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${digest}"

  plan:
    name: Plan (print the shiftgate command)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print the host command
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          MODE: ${{ needs.build.outputs.mode }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: ${DIGEST}"; exit 1; }
          cmd="shiftgate deploy ${SERVICE} --digest ${DIGEST}"
          echo "SHIFTGATE_COMMAND: ${cmd}"
          if [ "${MODE}" = dry-run ]; then
            echo "DRY RUN: no tailnet join, no SSH, no host touched."
          fi
          {
            echo "## Deploy OCI (shiftgate) — ${MODE}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}@${DIGEST}\` |"
            echo "| GIT_SHA | \`${SHORT_SHA}\` |"
            echo "| host command | \`${cmd}\` |"
            echo "| mode | \`${MODE}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy on the OCI host (shiftgate over SSH)
    needs: [build, plan]
    if: needs.build.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    environment: oci-production
    steps:
      - name: Validate inputs
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          HOST: ${{ vars.OCI_TAILNET_HOST }}
          DEPLOY_USER: ${{ vars.OCI_DEPLOY_USER || 'deploy' }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest"; exit 1; }
          [[ "${HOST}" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]] || { echo "vars.OCI_TAILNET_HOST is missing or invalid"; exit 1; }
          [[ "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "bad deploy user"; exit 1; }

      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: shiftgate deploy
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          HOST: ${{ vars.OCI_TAILNET_HOST }}
          DEPLOY_USER: ${{ vars.OCI_DEPLOY_USER || 'deploy' }}
          SSH_KEY: ${{ secrets.SHIFTGATE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SHIFTGATE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          # Exit codes: 0 ok, 1 failed (old colour still serving), 3 recovery
          # required (`shiftgate recover brewdial-api` on the host), 75 locked.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${HOST}" "shiftgate deploy ${SERVICE} --digest ${DIGEST}"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
