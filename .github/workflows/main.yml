name: Main CI

# Main stage of the three-tier pipeline (operator decision
# decision/2026-11-07/fleet-ci-three-tiers-r2). It runs on every push to main,
# cancels an older run, and covers:
#   - every basic check (Typecheck/Lint/Test, the DB integration suite, the
#     deploy-script and shiftgate checks);
#   - the migration and startup checks (`pnpm db:migrate`, the Hono HTTP
#     contract suite that starts the built server).
#
# One aggregation job posts the `ci-ok` commit status on the pushed sha.
# The deploy stage (.github/workflows/deploy.yml) starts from a successful run
# of this workflow for the same sha.
#
# `workflow_dispatch` and `workflow_call` exist so this stage can be run on any
# ref before merge (ci.yml's manual entry and ci-any-ref.yml call it; workflow_run
# and workflow_dispatch only work for a workflow file that exists on the default
# branch). With `ref` set (a resolved sha), the run checks out that sha and posts
# `ci-ok` on it; without `ref`, the run is the push or manual run it always was.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Resolved commit sha to run the main stage on. Empty runs the caller's own sha.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  statuses: write

concurrency:
  # A push to main keeps its per-ref group. An any-ref run is keyed on its
  # resolved sha, so neither one cancels the other.
  group: ${{ inputs.ref && format('main-ci-sha-{0}', inputs.ref) || format('main-ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  basic:
    # The PR check set, moved explicitly and run without -race.
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: brewdial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/brewdial_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mini-app domain copy matches packages/shared
        run: pnpm domain:check

      - name: Run type check
        run: pnpm check

      - name: Run lint
        run: pnpm lint

      - name: Run DB migrations
        run: pnpm db:migrate

      - name: Run tests
        run: pnpm test

      - name: Blackbox contract tests vs Hono
        run: pnpm --filter @brewdial/api test:http

  scripts:
    uses: ./.github/workflows/deploy-scripts.yml
    with:
      ref: ${{ inputs.ref }}

  render:
    uses: ./.github/workflows/shiftgate-render.yml
    with:
      ref: ${{ inputs.ref }}

  ci-ok:
    name: Aggregate main stage
    needs: [basic, scripts, render]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post the ci-ok commit status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref || github.sha }}
          BASIC: ${{ needs.basic.result }}
          SCRIPTS: ${{ needs.scripts.result }}
          RENDER: ${{ needs.render.result }}
        run: |
          set -euo pipefail
          state=success
          for result in "$BASIC" "$SCRIPTS" "$RENDER"; do
            echo "job result: ${result}"
            [ "$result" = success ] || state=failure
          done
          echo "ci-ok=${state} sha=${SHA}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" \
            -f context="ci-ok" \
            -f description="main stage: basic + deploy scripts + render (${state})" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
