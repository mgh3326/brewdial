name: Main CI

# Main stage of the three-tier pipeline (operator decision
# decision/2026-11-07/fleet-ci-three-tiers-r2). It runs on every push to main,
# cancels an older run, and covers:
#   - every basic check (Typecheck/Lint/Test, the DB integration suite, the
#     deploy-script and shiftgate checks, the k3d install/migration gate);
#   - the full PostgreSQL + MySQL integration suite against real databases,
#     without -race and not narrowed by changed paths (the `changes` job in
#     ci-kt.yml reports relevant=true for every non-PR event);
#   - the migration and startup checks (`pnpm db:migrate`, the Hono HTTP
#     contract suite that starts the built server, and the Spring context).
#
# One aggregation job posts the `ci-ok` commit status on the pushed sha.
# The deploy stage (.github/workflows/deploy.yml) starts from a successful run
# of this workflow for the same sha.
#
# `workflow_dispatch` exists so this stage can be measured on a topic branch;
# workflow_run only fires from the default branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic:
    uses: ./.github/workflows/ci.yml

  api:
    uses: ./.github/workflows/ci-kt.yml
    with:
      # The deployed-schema -> candidate migration path runs in the deploy stage.
      contract: false

  scripts:
    uses: ./.github/workflows/deploy-scripts.yml

  render:
    uses: ./.github/workflows/shiftgate-render.yml

  k8s:
    uses: ./.github/workflows/k8s-validate.yml

  ci-ok:
    name: Aggregate main stage
    needs: [basic, api, scripts, render, k8s]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post the ci-ok commit status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          BASIC: ${{ needs.basic.result }}
          API: ${{ needs.api.result }}
          SCRIPTS: ${{ needs.scripts.result }}
          RENDER: ${{ needs.render.result }}
          K8S: ${{ needs.k8s.result }}
        run: |
          set -euo pipefail
          state=success
          for result in "$BASIC" "$API" "$SCRIPTS" "$RENDER" "$K8S"; do
            echo "job result: ${result}"
            [ "$result" = success ] || state=failure
          done
          echo "ci-ok=${state} sha=${SHA}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" \
            -f context="ci-ok" \
            -f description="main stage: basic + real-DB integration + install gate (${state})" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
