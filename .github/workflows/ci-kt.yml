name: Kotlin API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api-kt/**"
      - "packages/db/migrations/**"
      - ".github/workflows/ci-kt.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api-kt/**"
      - "packages/db/migrations/**"
      - ".github/workflows/ci-kt.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Kotlin API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: brewdial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/brewdial_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared and database packages
        run: |
          pnpm --filter @brewdial/shared build
          pnpm --filter @brewdial/db build

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Kotlin API
        working-directory: apps/api-kt
        run: ./gradlew --no-daemon build

      - name: Contract tests vs Spring (2a subset)
        working-directory: apps/api-kt
        run: |
          scripts/contract-test.sh \
            apps/api/src/routes/health.test.ts \
            apps/api/src/cors.test.ts \
            apps/api/src/routes/beans.test.ts \
            apps/api/src/routes/beans.search.test.ts \
            apps/api/src/routes/recipes.test.ts \
            apps/api/src/routes/recipes.write.test.ts \
            apps/api/src/routes/feedback.owner.test.ts
          scripts/contract-test.sh apps/api/src/routes/shape.test.ts \
            -t 'GET /api/recipes(?:/:code/feedback)? shape parity'
