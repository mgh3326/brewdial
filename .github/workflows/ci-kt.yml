name: Kotlin API CI

# The Kotlin API supports PostgreSQL and MySQL through JPA/Hibernate; the
# vendor is picked by the DATABASE_URL scheme. Both test jobs run the same
# Gradle suite, each against its own service container, and the final job
# links them into one required check (.mergewake/policy.yaml).
#
# A path filter under `on:` would stop the required check from reporting on
# unrelated PRs and strand them. So this always runs: `changes` compares the
# paths, the database jobs skip when nothing they cover changed, and the final
# job passes right away.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: API paths changed
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A pull_request checkout is the merge commit: HEAD^1 is the base branch.
          fetch-depth: 2

      - name: Test the path check
        run: bash .github/scripts/api-paths-changed-test.sh

      - name: Compare with the base
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          else
            base="$BEFORE"
            # A push can carry several commits. A failed fetch makes the script run the tests.
            git fetch --quiet --depth=1 origin "$base" || true
          fi
          echo "relevant=$(.github/scripts/api-paths-changed.sh "$base")" >> "$GITHUB_OUTPUT"

  postgresql:
    name: API tests (PostgreSQL 17)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: brewdial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Empty database: Flyway applies db/migration/postgresql/V1 itself.
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/brewdial_test
      # node-pg-migrate database (the production shape): Flyway must baseline
      # it at V1 and Hibernate must validate against it.
      CONTRACT_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/brewdial_contract

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared and database packages
        run: |
          pnpm --filter @brewdial/shared build
          pnpm --filter @brewdial/db build

      - name: Create the node-pg-migrate contract database
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d brewdial_test \
            -c 'create database brewdial_contract'
          DATABASE_URL="$CONTRACT_DATABASE_URL" pnpm db:migrate

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test Kotlin API (Flyway V1 on an empty database)
        working-directory: apps/api-kt
        run: ./gradlew --no-daemon build

      - name: Contract tests vs Spring (node-pg-migrate schema, Flyway baseline)
        working-directory: apps/api-kt
        env:
          DATABASE_URL: ${{ env.CONTRACT_DATABASE_URL }}
        run: scripts/contract-test.sh

  mysql:
    name: API tests (MySQL 8.4)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        # OCI HeatWave runs the MySQL 8.4 LTS line.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysqlpassword
          MYSQL_DATABASE: brewdial_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysqlpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Empty database: Flyway applies db/migration/mysql/V1.
      DATABASE_URL: mysql://root:mysqlpassword@127.0.0.1:3306/brewdial_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # RecommendationEngineTest compares against the compiled TypeScript engine.
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build shared package
        run: |
          pnpm install --frozen-lockfile --filter @brewdial/shared...
          pnpm --filter @brewdial/shared build

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test Kotlin API
        working-directory: apps/api-kt
        run: ./gradlew --no-daemon build

  # The one job with both databases: the data copy runs between them.
  copy:
    name: Data copy (PostgreSQL <-> MySQL)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: brewdial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysqlpassword
          MYSQL_DATABASE: brewdial_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysqlpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/brewdial_test
      BREWDIAL_COPY_TEST_POSTGRES_URL: postgres://postgres:postgrespassword@localhost:5432/brewdial_test
      BREWDIAL_COPY_TEST_MYSQL_URL: mysql://root:mysqlpassword@127.0.0.1:3306/brewdial_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Copy tests against both databases
        working-directory: apps/api-kt
        run: ./gradlew --no-daemon test --tests '*DatabaseCopyTest'

      # The class skips without its two variables, and a skip would look like a pass.
      - name: The copy tests ran
        working-directory: apps/api-kt
        run: grep -q 'skipped="0"' build/test-results/test/TEST-com.brewdial.api.tools.DatabaseCopyTest.xml

  api-tests:
    name: API tests (PostgreSQL + MySQL)
    needs: [changes, postgresql, mysql, copy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All database jobs passed, or nothing they cover changed
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          POSTGRESQL: ${{ needs.postgresql.result }}
          MYSQL: ${{ needs.mysql.result }}
          COPY: ${{ needs.copy.result }}
        run: |
          echo "changes=${CHANGES} relevant=${RELEVANT} postgresql=${POSTGRESQL} mysql=${MYSQL} copy=${COPY}"
          [ "${CHANGES}" = success ] || exit 1
          [ "${RELEVANT}" = false ] && exit 0
          [ "${POSTGRESQL}" = success ] && [ "${MYSQL}" = success ] && [ "${COPY}" = success ]
