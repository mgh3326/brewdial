name: CI Gate

# PR stage of the three-tier pipeline, unchanged and still the merge condition
# (.mergewake/policy.yaml).
#
# `workflow_dispatch` is the manual ref path. GitHub only accepts a dispatch for
# a workflow file that exists on the default branch, and main.yml/deploy.yml
# only arrive with this PR, so this registered file runs one stage on the
# chosen ref through a local reusable workflow (read from that ref):
#   stage=pr     only the PR jobs (same as pull_request)
#   stage=main   only Main CI (main.yml)
#   stage=deploy only the deploy stage (deploy.yml)
# It runs that stage and nothing else, so the run's duration is that stage's.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to run on this ref.
        required: true
        type: choice
        options: [pr, main, deploy]

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, Lint & Test
    # A direct dispatch runs only the stage asked for; every PR run keeps the
    # full PR job.
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'pr'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: brewdial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/brewdial_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mini-app domain copy matches packages/shared
        run: pnpm domain:check

      - name: Run type check
        run: pnpm check

      - name: Run lint
        run: pnpm lint

      - name: Run DB migrations
        run: pnpm db:migrate

      - name: Run tests
        run: pnpm test

      - name: Blackbox contract tests vs Hono
        run: pnpm --filter @brewdial/api test:http

  api-tests-mysql:
    # Same PR trigger as `ci`. The PostgreSQL job above is unchanged.
    name: API tests (MySQL 8.4, Node)
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'pr'
    runs-on: ubuntu-latest

    services:
      mysql:
        # OCI HeatWave runs the MySQL 8.4 LTS line.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysqlpassword
          MYSQL_DATABASE: brewdial_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysqlpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: mysql://root:mysqlpassword@127.0.0.1:3306/brewdial_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API imports @brewdial/db from its build output.
      - name: Build db package
        run: pnpm --filter @brewdial/db build

      - name: Run DB migrations
        run: pnpm db:migrate

      # Second run in the same job: must log "nothing to apply".
      - name: Run DB migrations again (applies nothing)
        run: pnpm db:migrate

      - name: Run API tests on MySQL
        run: pnpm --filter @brewdial/api test

      - name: Build MCP package
        run: pnpm --filter @brewdial/mcp build

      - name: Blackbox contract tests vs Hono on MySQL
        run: pnpm --filter @brewdial/api test:http

  api-image-mysql:
    name: Node image migrations and health (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysqlpassword
          MYSQL_DATABASE: brewdial_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysqlpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag brewdial-api-image-check .

      - name: Run exact shiftgate args twice and check health
        shell: bash
        run: |
          set -euo pipefail
          container=brewdial-api-image-check
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" --network host --memory=512m \
            --env DATABASE_URL=mysql://root:mysqlpassword@127.0.0.1:3306/brewdial_test \
            --env HOST=127.0.0.1 --env NODE_ENV=production \
            brewdial-api-image-check \
            sh -c 'node /migrate/node_modules/tsx/dist/cli.mjs /migrate/scripts/migrate.ts && exec node /app/dist/server.js'
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3020/api/db/health; then
              printf '\n/api/db/health returned 200\n'
              break
            fi
            [ "$attempt" -lt 60 ] || { docker logs "$container"; exit 1; }
            sleep 2
          done
          first_logs="$(docker logs "$container" 2>&1)"
          printf '%s\n' "$first_logs"
          grep -F 'applied 001_baseline' <<<"$first_logs"
          docker restart "$container"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3020/api/db/health; then
              printf '\n/api/db/health returned 200 after restart\n'
              break
            fi
            [ "$attempt" -lt 60 ] || { docker logs "$container"; exit 1; }
            sleep 2
          done
          second_logs="$(docker logs "$container" 2>&1)"
          printf '%s\n' "$second_logs"
          grep -F 'nothing to apply' <<<"$second_logs"
          docker rm -f "$container"

  main-stage:
    # Manual ref path: Main CI on the dispatched ref.
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'main'
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/main.yml

  deploy-stage:
    # Manual ref path: the deploy stage on the dispatched ref's sha.
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'deploy'
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
