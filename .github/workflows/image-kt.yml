name: Kotlin API Container Image

# Builds the Kotlin API image for linux/arm64 (the OCI box is aarch64) and
# pushes it to GHCR with an immutable `:sha-<short>` tag and a moving `:latest`
# tag on main pushes only. Buildpacks selects the default Spring Boot builder
# and run image; native-image builds are intentionally out of scope here.
#
# Deploy is deliberately separate. This workflow builds and publishes only.

on:
  push:
    branches: [main]
    paths:
      - "apps/api-kt/**"
      - ".github/workflows/image-kt.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api-kt/**"
      - ".github/workflows/image-kt.yml"

permissions:
  contents: read

jobs:
  build-push:
    name: Build & push Kotlin API (arm64) to GHCR
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/brewdial-api-kt"
          SHORT="$(git rev-parse --short=7 HEAD)"
          {
            echo "image=${IMAGE}"
            echo "sha_tag=${IMAGE}:sha-${SHORT}"
            echo "latest_tag=${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build JVM image with Spring Boot Buildpacks
        id: build
        working-directory: apps/api-kt
        run: |
          set -euo pipefail
          STARTED_AT="$(date +%s)"
          ./gradlew --no-daemon --info bootBuildImage --imageName '${{ steps.tags.outputs.sha_tag }}'
          ELAPSED_SECONDS="$(( $(date +%s) - STARTED_AT ))"
          echo "build_seconds=${ELAPSED_SECONDS}" >> "$GITHUB_OUTPUT"
          echo "Build duration seconds: ${ELAPSED_SECONDS}"
          # bootBuildImage logs the resolved default builder and run image above.

      - name: Verify non-root runtime and record image size
        run: |
          set -euo pipefail
          CONFIGURED_USER="$(docker image inspect '${{ steps.tags.outputs.sha_tag }}' --format '{{.Config.User}}')"
          # Paketo's tiny run image intentionally omits coreutils. Mount a
          # pinned static BusyBox `id` only for this probe; Docker still applies
          # the target image's configured cnb user before executing it.
          PROBE_CONTAINER="uid-probe-${RANDOM}-${RANDOM}"
          PROBE_BINARY="${RUNNER_TEMP}/id"
          cleanup() {
            docker rm -f "${PROBE_CONTAINER}" >/dev/null 2>&1 || true
            rm -f "${PROBE_BINARY}"
          }
          trap cleanup EXIT
          docker create --name "${PROBE_CONTAINER}" \
            docker.io/library/busybox@sha256:2f00809d318560dc1f14d7c10fffd18bfd4dd133b56b04f60fda7f45719b3950 >/dev/null
          docker cp "${PROBE_CONTAINER}:/bin/busybox" "${PROBE_BINARY}"
          docker rm "${PROBE_CONTAINER}" >/dev/null
          chmod 0555 "${PROBE_BINARY}"
          runtime_id() {
            docker run --rm \
              --mount type=bind,src="${PROBE_BINARY}",dst=/usr/local/bin/id,readonly \
              --env PATH=/usr/local/bin \
              --entrypoint id '${{ steps.tags.outputs.sha_tag }}' "$@"
          }
          RUNTIME_ID="$(runtime_id)"
          RUNTIME_UID="$(runtime_id -u)"
          echo "Configured user: ${CONFIGURED_USER}"
          echo "Runtime identity: ${RUNTIME_ID}"
          echo "Runtime uid: ${RUNTIME_UID}"
          echo "Image size bytes: $(docker image inspect '${{ steps.tags.outputs.sha_tag }}' --format '{{.Size}}')"
          [ "${CONFIGURED_USER}" = "1002:1001" ] || { echo "ERROR: expected Paketo cnb user 1002:1001"; exit 1; }
          case "${RUNTIME_ID}" in *"(cnb)"*) ;; *) echo "ERROR: expected cnb runtime identity"; exit 1;; esac
          [ "${RUNTIME_UID}" = "1002" ] || { echo "ERROR: expected Paketo cnb uid 1002"; exit 1; }

      - name: Push immutable sha tag to GHCR
        # Fork PRs get a read-only token; never push from them.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker push '${{ steps.tags.outputs.sha_tag }}'

      - name: Push latest tag to GHCR (main push only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker tag '${{ steps.tags.outputs.sha_tag }}' '${{ steps.tags.outputs.latest_tag }}'
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker push '${{ steps.tags.outputs.latest_tag }}'

      - name: Record digest (deployment reference)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          docker buildx imagetools inspect '${{ steps.tags.outputs.sha_tag }}'
